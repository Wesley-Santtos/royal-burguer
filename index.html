<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Royal Burguer — Cardápio Digital</title>
  <meta name="description" content="Royal Burguer — sabor de verdade em cada mordida. Veja o cardápio e peça pelo WhatsApp." />
  <meta name="theme-color" content="#9E4A1F" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="phone">
    <main>
      <!-- HERO: imagem da identidade -->
      <section class="hero" id="topo">
        <img src="assets/img/hero.jpg" alt="Royal Burguer — sabor de verdade em cada mordida" width="900" height="1296" fetchpriority="high" />
      </section>

      <!-- Categorias -->
      <nav class="cats" id="cats" aria-label="Categorias do cardápio"></nav>

      <!-- Lanche do Momento (3D) -->
      <section class="feature" id="destaque" aria-label="Lanche do momento"></section>

      <!-- CARDÁPIO -->
      <section class="menu" id="cardapio">
        <p class="menu__note">Cardápio · itens e preços fictícios</p>
        <div id="menu-lista"></div>
      </section>

      <!-- CTA -->
      <section class="cta">
        <h2>Deu fome?</h2>
        <p>Faça seu pedido agora pelo WhatsApp.</p>
        <a class="btn btn--gold btn--lg" data-wa href="#">Pedir no WhatsApp</a>
      </section>
    </main>

    <footer class="foot" id="contato">
      <svg viewBox="0 0 44 44" aria-hidden="true" class="foot__mark">
        <path d="M11 15 L15 7 L19 14 L22 5 L25 14 L29 7 L33 15 Z" fill="#F4A93C"/>
        <rect x="9" y="16" width="26" height="5" rx="2.5" fill="#F4A93C"/>
        <path d="M10 26 q12 -8 24 0" fill="none" stroke="#F6EFE0" stroke-width="3.4" stroke-linecap="round"/>
        <line x1="9" y1="32" x2="35" y2="32" stroke="#F6EFE0" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M10 38 q12 6 24 0" fill="none" stroke="#F6EFE0" stroke-width="3.4" stroke-linecap="round"/>
      </svg>
      <p class="foot__tag">Sabor de verdade em cada mordida.</p>
      <p data-cfg="endereco"></p>
      <p data-cfg="horario"></p>
      <p class="foot__links">
        <a data-wa href="#">WhatsApp</a>
        <a data-cfg="instagram" target="_blank" rel="noopener">Instagram</a>
      </p>
      <p class="foot__legal">© <span data-year>2026</span> Royal Burguer — cardápio digital. Projeto demonstrativo. Dados, preços e contatos fictícios.</p>
    </footer>
  </div>

  <a class="wa-float" data-wa href="#" aria-label="Pedir no WhatsApp">
    <svg viewBox="0 0 32 32" aria-hidden="true" width="30" height="30">
      <path fill="currentColor" d="M16 3C8.8 3 3 8.8 3 16c0 2.3.6 4.5 1.7 6.4L3 29l6.8-1.8c1.8 1 3.9 1.5 6.2 1.5 7.2 0 13-5.8 13-13S23.2 3 16 3zm0 23.6c-2 0-3.9-.5-5.5-1.5l-.4-.2-4 1 1.1-3.9-.3-.4C6.6 19.6 6 17.8 6 16 6 10.5 10.5 6 16 6s10 4.5 10 10-4.5 10.6-10 10.6zm5.5-7.4c-.3-.2-1.8-.9-2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.3.4-.6.1-.2 0-.4 0-.6l-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.9s1.2 3.3 1.4 3.6c.2.3 2.5 3.8 6 5.3.8.4 1.5.6 2 .7.8.3 1.6.2 2.2.1.7-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4-.1-.2-.3-.2-.6-.4z"/>
    </svg>
  </a>

  <script src="data/menu.js" defer></script>
  <script src="assets/js/menu.js" defer></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
